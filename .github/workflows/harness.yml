name: Harness

# VER-1 aplicado al propio harness: consistencia de la documentación y las dos
# plantillas en verde. El job astro-e2e corre los e2e y Lighthouse de la
# plantilla Astro cuando cambia stacks/astro/, cada semana y a mano.

on:
  pull_request:
  push:
    branches: [main]
  # Semanal, solo para astro-e2e: detecta deriva de navegador, wrangler y Lighthouse.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    name: Verificador de consistencia
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # La comprobación de versiones necesita la base y su merge-base.
          fetch-depth: 0
      - run: python3 --version
      - name: Tests del verificador
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Verificador sobre el repo
        run: python3 -B scripts/check_harness.py
      # Lo que entra a main publica una versión: un pull request hacia main se
      # compara con su base, y un push a main con el commit anterior. En otras
      # ramas "Sin publicar" es válido y no se corre.
      - name: Versiones de lo que entra a main
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          python3 -B scripts/check_harness.py --base "$BASE"

  rust:
    name: Plantilla Rust
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stacks/rust/template
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stacks/rust/template
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # La plantilla debe ejercitar cada regla: un test de arquitectura sin
      # material falla. Un proyecto nuevo hereda los tests sin la variable,
      # porque ahí un conjunto vacío (todavía sin queries/) es legítimo.
      - run: cargo test --workspace
        env:
          ARCH_REQUIRE_MATERIAL: "1"

  astro:
    name: Plantilla Astro
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stacks/astro/template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: stacks/astro/template/.nvmrc
          cache: npm
          cache-dependency-path: stacks/astro/template/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # ¿Cambió stacks/astro/ o este workflow? Sin acción de terceros: diff contra
  # la base del pull request o contra el commit anterior del push. El workflow
  # cuenta porque define el job: un arreglo de astro-e2e que solo lo toca a él
  # también tiene que correr.
  astro-changes:
    name: Cambios en stacks/astro o en el workflow
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$(git merge-base "$BASE" HEAD)" HEAD -- \
            stacks/astro .github/workflows/harness.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # WEB-4, WEB-6, WEB-7 y WEB-9 (e2e con axe, CSP, terceros y metadatos) y
  # WEB-5 (presupuestos de Lighthouse) sobre el build servido por wrangler dev.
  astro-e2e:
    name: Plantilla Astro, e2e y Lighthouse
    needs: astro-changes
    if: >-
      !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.astro-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stacks/astro/template
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: stacks/astro/template/.nvmrc
          cache: npm
          cache-dependency-path: stacks/astro/template/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché del navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: End-to-end (páginas, CSP, axe, terceros, formulario)
        run: npm run test:e2e
      # Lighthouse usa el Google Chrome del runner, como el CI de la plantilla. El
      # Chromium de Playwright aborta en Ubuntu 24.04 ("No usable sandbox": AppArmor
      # restringe los user namespaces), y pasarle --no-sandbox desactivaría el sandbox.
      - name: Presupuestos de Lighthouse (WEB-5)
        run: npm run lighthouse
      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-reports
          path: |
            stacks/astro/template/playwright-report/
            stacks/astro/template/test-results/
            stacks/astro/template/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
