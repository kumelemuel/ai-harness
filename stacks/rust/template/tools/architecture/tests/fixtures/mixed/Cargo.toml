# Fixture de tools/architecture (tests/naming.rs): un workspace a medio adoptar,
# con contextos legacy (`iam`, `vault`) y uno separado (`shop`). No es miembro
# de ningún workspace real; los tests solo lo leen.
[workspace]
members = ["kernel", "contexts/iam", "contexts/vault", "contexts/shop/application", "contexts/shop/api"]

[workspace.dependencies]
kernel = { path = "kernel" }
